name: CI & Package Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  release:
    types: ["published"]

permissions:
  contents: read

jobs:
  test:
    name: Verify MCP Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyYAML for OpenAPI & Smithery manifest verification
        run: python -m pip install --upgrade pip pyyaml

      - name: Run full JSON-RPC stdio, HTTP & manifest test suite
        run: python test_mcp.py

  build-package:
    name: Build Wheel & Source Distribution
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Smoke-test installed wheel entrypoint outside repo directory
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          ATLAS_OFFLINE=1 python -c '
          import json, subprocess
          p = subprocess.Popen(["orphan-disease-opportunity-mcp"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          p.stdin.write(json.dumps({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}) + "\n")
          p.stdin.flush()
          resp = json.loads(p.stdout.readline())
          assert resp["result"]["serverInfo"]["name"] == "orphan-disease-opportunity-mcp"
          p.stdin.close()
          p.wait(timeout=5)
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher OIDC)
    needs: build-package
    if: github.event_name == 'release' && github.event.action == 'published' && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/orphan-disease-opportunity-mcp
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
